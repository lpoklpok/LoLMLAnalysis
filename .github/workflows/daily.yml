name: Daily pipeline

on:
  schedule:
    - cron: '0 8 * * *'    # 8am UTC — after LCS finishes, OE publish window
    - cron: '0 14 * * *'  # 2pm UTC — after LCK/LPL morning session
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv (fast pip replacement)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Cache historical OE data (2014–2025)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: oe-historical-v1

      - name: Cache processed state (features + ELO checkpoint)
        uses: actions/cache@v4
        with:
          path: data/processed
          key: processed-v2-${{ github.run_number }}
          restore-keys: |
            processed-v2-

      - name: Refresh OE mirror (copy Tim's CSV to your Drive folder)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python src/refresh_oe_mirror.py
        continue-on-error: true

      - name: Pull latest Oracle's Elixir data
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OE_DRIVE_FILE_ID: ${{ secrets.OE_DRIVE_FILE_ID }}
          OE_DRIVE_FOLDER_ID: ${{ secrets.OE_DRIVE_FOLDER_ID }}
        run: python src/PullOEData.py
        continue-on-error: true

      - name: Combine raw OE data into games.csv
        run: python src/combine_data.py

      - name: Merge game + odds data
        run: python src/merge_data.py

      - name: Merge Polymarket per-game implied odds (no-op if snapshot CSV missing)
        run: python src/merge_polymarket_data.py
        continue-on-error: true

      - name: Build features + ELO state
        run: python src/feature_engineering.py

      - name: Train model + save predictions
        run: python src/train_model.py

      - name: Upload game features to Supabase
        run: python src/upload_game_features.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload predictions to Supabase
        run: python src/upload_predictions.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload player ELO rankings to Supabase
        run: python src/upload_player_elos.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate upcoming game predictions
        run: python src/predict_upcoming.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Export model params JSON
        run: python src/export_model_params.py

      - name: Export champion findings JSON
        run: python src/export_champion_findings.py

      - name: Export daily PnL JSON (Polymarket + Kalshi)
        env:
          POLYMARKET_WALLET:  ${{ secrets.POLYMARKET_WALLET }}
          KALSHI_API_KEY:     ${{ secrets.KALSHI_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python src/export_pnl_daily.py
        continue-on-error: true

      - name: Commit updated JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/model_params.json web/public/champion_findings.json web/public/pnl_daily.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update model_params + champion_findings [skip ci]"
          git pull --rebase --autostash origin main
          git push
